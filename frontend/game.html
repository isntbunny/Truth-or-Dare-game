<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>真心话大冒险 - 游戏房间</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="banner compact">
    <h1>🎮 游戏房间</h1>
    <div class="banner-actions">
      <span id="roomTitle"></span>
      <a href="./index.html" class="ghost-btn link-btn">返回大厅</a>
    </div>
  </header>

  <main class="game-layout">
    <section class="game-actions">
      <button id="rollBtn" class="primary-btn">🎲 掷骰子</button>
      <button id="drawBtn" class="primary-btn">🔥 抽题目</button>
    </section>

    <section id="log" class="log-panel"></section>

    <section class="chat-panel">
      <input id="messageInput" type="text" placeholder="输入聊天内容..." />
      <button id="sendBtn" class="primary-btn">发送消息</button>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
